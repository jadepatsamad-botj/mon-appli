<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f7a5c">
<link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Jade</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div class="topbar">
    <div>
      <h1 id="app-name">Jade</h1>
      <p class="sub" data-i18n="tagline"></p>
    </div>
    <select id="lang" aria-label="Langue / Language / ภาษา / Ngôn ngữ">
      <option value="fr">Français</option>
      <option value="en">English</option>
      <option value="th">ไทย</option>
      <option value="vi">Tiếng Việt</option>
      <option value="zh">中文</option>
      <option value="id">Bahasa Indonesia</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="ms">Bahasa Melayu</option>
      <option value="tl">Filipino</option>
      <option value="lo">ລາວ</option>
      <option value="km">ខ្មែរ</option>
    </select>
  </div>

  <!-- Connexion / inscription -->
  <section class="card" id="auth">
    <div class="hero">
      <img src="icon-180.png" alt="" class="hero-logo">
      <h2 class="hero-title" data-i18n="hero_title"></h2>
      <ul class="hero-list">
        <li data-i18n="hero_f1"></li>
        <li data-i18n="hero_f2"></li>
        <li data-i18n="hero_f3"></li>
      </ul>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-signup" aria-selected="true" type="button" data-i18n="tab_signup"></button>
      <button role="tab" id="tab-login" aria-selected="false" type="button" data-i18n="tab_login"></button>
    </div>
    <form id="form" novalidate>
      <label for="email" data-i18n="email"></label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password" data-i18n="password"></label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required>
      <div id="signup-only">
        <label for="birth" data-i18n="birth"></label>
        <input id="birth" type="date">
        <label class="check" for="adult">
          <input id="adult" type="checkbox">
          <span data-i18n="adult"></span>
        </label>
        <button class="linkbtn" id="legal-link-auth" type="button" data-i18n="legal_btn"></button>
      </div>
      <button class="primary" id="submit" type="submit"></button>
      <div style="text-align:center"><button class="linkbtn" id="forgot" type="button" data-i18n="forgot" hidden></button></div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </form>
  </section>

  <!-- Formulaire de profil -->
  <section class="card" id="profile" hidden>
    <h2 data-i18n="profile_title"></h2>
    <p class="sub" style="margin-bottom:8px" data-i18n="profile_sub"></p>
    <form id="pform" novalidate>
      <label data-i18n="photos_label"></label>
      <div id="slots" class="slots"></div>

      <label for="first_name" data-i18n="first_name"></label>
      <input id="first_name" type="text" maxlength="40" autocomplete="given-name" required>

      <label for="country" data-i18n="country"></label>
      <select id="country"></select>

      <label for="gender" data-i18n="i_am"></label>
      <select id="gender">
        <option value="" data-i18n="choose"></option>
        <option value="homme" data-i18n="opt_man"></option>
        <option value="femme" data-i18n="opt_woman"></option>
        <option value="autre" data-i18n="opt_other"></option>
      </select>

      <label for="looking_for" data-i18n="looking"></label>
      <select id="looking_for">
        <option value="" data-i18n="choose"></option>
        <option value="homme" data-i18n="opt_man"></option>
        <option value="femme" data-i18n="opt_woman"></option>
        <option value="tous" data-i18n="opt_any"></option>
      </select>

      <label for="city" data-i18n="city"></label>
      <input id="city" type="text" maxlength="40" autocomplete="address-level2">

      <label for="intention" data-i18n="intent"></label>
      <select id="intention">
        <option value="" data-i18n="choose"></option>
        <option value="serieux" data-i18n="i_serieux"></option>
        <option value="mariage" data-i18n="i_mariage"></option>
        <option value="amitie" data-i18n="i_amitie"></option>
        <option value="voir" data-i18n="i_voir"></option>
      </select>

      <label data-i18n="spoken"></label>
      <div id="spoken" class="langs"></div>

      <label data-i18n="interests"></label>
      <div id="interests" class="langs"></div>

      <label for="bio" data-i18n="bio"></label>
      <textarea id="bio" maxlength="500" data-i18n-ph="bio_ph"></textarea>
      <div class="count"><span id="bio-count">0</span> / 500</div>

      <button class="primary" id="psave" type="submit" data-i18n="save_profile"></button>
      <button class="secondary" id="pcancel" type="button" hidden data-i18n="cancel"></button>
      <div class="msg" id="pmsg" role="status" aria-live="polite"></div>
    </form>
  </section>

  <!-- Accueil / mon profil -->
  <section class="card" id="home" hidden>
    <img id="view-photo" class="view-photo" alt="" hidden>
    <h2 id="view-name"></h2>
    <div id="view-tags"></div>
    <p class="bio" id="view-bio"></p>
    <div class="complete" id="complete" hidden>
      <div class="complete-t" id="complete-t"></div>
      <div class="bar"><span id="complete-bar"></span></div>
      <div class="complete-h" data-i18n="complete_hint"></div>
    </div>
    <p class="sub" id="who" style="margin:16px 0 0;font-size:.85rem"></p>
    <button class="primary" id="go-discover" type="button" data-i18n="discover"></button>
    <button class="secondary" id="go-matches" type="button" data-i18n="matches"></button>
    <button class="secondary" id="go-events" type="button" data-i18n="events_btn"></button>
    <button class="secondary" id="go-likes" type="button" data-i18n="likes_btn"></button>
    <button class="secondary" id="go-views" type="button" data-i18n="views_btn"></button>
    <button class="secondary goldbtn" id="go-premium" type="button" data-i18n="premium_btn"></button>
    <button class="secondary goldbtn" id="go-concierge" type="button" data-i18n="concierge_btn" hidden></button>
    <button class="secondary" id="edit" type="button" data-i18n="edit"></button>
    <button class="secondary" id="go-verify" type="button" data-i18n="verify_btn"></button>
    <button class="secondary" id="go-safety" type="button" data-i18n="safety_btn"></button>
    <button class="secondary" id="go-settings" type="button" data-i18n="settings_btn"></button>
    <button class="secondary" id="go-legal" type="button" data-i18n="legal_btn"></button>
    <button class="secondary" id="go-admin" type="button" hidden>Administration</button>
    <button class="secondary" id="logout" type="button" data-i18n="logout"></button>
    <div style="text-align:center;margin-top:8px">
      <button class="linkbtn danger" id="delete-account" type="button" data-i18n="delete"></button>
    </div>
    <div class="msg" id="hmsg" role="status" aria-live="polite"></div>
  </section>

  <!-- Découverte -->
  <section class="card" id="discover" hidden>
    <button class="back" id="discover-back" type="button" data-i18n="back"></button>
    <details class="filters" id="filters">
      <summary data-i18n="filters"></summary>
      <div class="two">
        <div><label for="f-min" data-i18n="age_min"></label><input id="f-min" type="number" min="18" max="99" value="18"></div>
        <div><label for="f-max" data-i18n="age_max"></label><input id="f-max" type="number" min="18" max="99" value="99"></div>
      </div>
      <label for="f-country" data-i18n="country"></label>
      <select id="f-country"></select>
      <div class="two">
        <div><label for="f-intent" data-i18n="intent"></label>
          <select id="f-intent">
            <option value="" data-i18n="all_intents"></option>
            <option value="serieux" data-i18n="i_serieux"></option>
            <option value="mariage" data-i18n="i_mariage"></option>
            <option value="amitie" data-i18n="i_amitie"></option>
            <option value="voir" data-i18n="i_voir"></option>
          </select></div>
        <div><label for="f-lang" data-i18n="filter_lang"></label><select id="f-lang"></select></div>
      </div>
      <button class="secondary" id="f-apply" type="button" data-i18n="apply"></button>
    </details>
    <div class="match-banner" id="match-banner" hidden></div>
    <div style="text-align:right"><button class="linkbtn" id="undo" type="button" data-i18n="undo" hidden></button></div>
    <div id="cand" hidden>
      <img id="cand-photo" class="view-photo" alt="" hidden>
      <h2 id="cand-name"></h2>
      <div id="cand-tags"></div>
      <p class="bio" id="cand-bio"></p>
      <div class="row">
        <button class="secondary" id="pass" type="button" data-i18n="pass"></button>
        <button class="primary" id="like" type="button" data-i18n="like"></button>
      </div>
      <button class="secondary superbtn" id="superlike" type="button" data-i18n="super_like"></button>
      <div style="text-align:center;margin-top:8px">
        <button class="linkbtn" id="cand-report" type="button" data-i18n="report_profile"></button>
      </div>
    </div>
    <p class="empty" id="cand-empty" hidden data-i18n="no_more"></p>
    <div class="msg" id="dmsg" role="status" aria-live="polite"></div>
  </section>

  <!-- Matchs -->
  <section class="card" id="matches" hidden>
    <button class="back" id="matches-back" type="button" data-i18n="back"></button>
    <h2 data-i18n="matches_title"></h2>
    <div id="matches-list"></div>
    <p class="empty" id="matches-empty" hidden></p>
  </section>

  <!-- Activités -->
  <section class="card" id="events" hidden>
    <button class="back" id="events-back" type="button" data-i18n="back"></button>
    <h2 data-i18n="events_title"></h2>
    <p class="sub" style="font-size:.85rem" data-i18n="ev_safety"></p>
    <div id="events-list"></div>
    <p class="empty" id="events-empty" hidden></p>
    <div class="msg" id="evmsg" role="status" aria-live="polite"></div>
  </section>

  <!-- Abonnements -->
  <section class="card" id="premium" hidden>
    <button class="back" id="premium-back" type="button" data-i18n="back"></button>
    <h2 data-i18n="premium_title"></h2>
    <div class="msg ok" id="premium-status"></div>
    <div class="plans">
      <div class="plan" data-plan="premium">
        <div class="plan-name">★ Premium</div><div class="plan-price"><b class="pp"></b> <span data-i18n="per_month"></span></div>
        <ul><li data-i18n="f_p1"></li><li data-i18n="f_p2"></li><li data-i18n="f_p3"></li><li data-i18n="f_p4"></li></ul>
        <button class="primary buy" type="button" data-i18n="choose_plan"></button>
      </div>
      <div class="plan gold" data-plan="gold">
        <div class="plan-name">✦ Gold</div><div class="plan-price"><b class="pp"></b> <span data-i18n="per_month"></span></div>
        <ul><li class="lead" data-i18n="f_g0"></li><li data-i18n="f_g1"></li><li data-i18n="f_g2"></li><li data-i18n="f_g3"></li></ul>
        <button class="primary buy" type="button" data-i18n="choose_plan"></button>
      </div>
      <div class="plan diamond" data-plan="diamond">
        <div class="plan-name">💎 Diamond</div><div class="plan-price"><b class="pp"></b> <span data-i18n="per_month"></span></div>
        <ul><li class="lead" data-i18n="f_d0"></li><li data-i18n="f_d1"></li><li data-i18n="f_d2"></li></ul>
        <button class="primary buy" type="button" data-i18n="choose_plan"></button>
      </div>
    </div>
    <div style="text-align:center"><button class="linkbtn" id="manage-sub" type="button" data-i18n="manage_sub" hidden></button></div>
    <p class="sub" style="font-size:.8rem;margin:10px 0 0" data-i18n="sub_note"></p>
    <div class="msg" id="pmmsg" role="status" aria-live="polite"></div>
  </section>

  <!-- Assistant Jade (Diamond) -->
  <section class="card" id="concierge" hidden>
    <button class="back" id="concierge-back" type="button" data-i18n="back"></button>
    <h2 data-i18n="concierge_title"></h2>
    <p data-i18n="concierge_text"></p>
    <textarea id="concierge-msg" maxlength="2000" data-i18n-ph="concierge_ph"></textarea>
    <button class="primary" id="concierge-send" type="button" data-i18n="concierge_send"></button>
    <p class="sub" style="font-size:.85rem;margin-top:10px" data-i18n="ai_soon"></p>
    <div class="msg" id="cgmsg" role="status" aria-live="polite"></div>
    <div id="concierge-list"></div>
  </section>

  <!-- Qui a vu mon profil -->
  <section class="card" id="views" hidden>
    <button class="back" id="views-back" type="button" data-i18n="back"></button>
    <h2 data-i18n="views_title"></h2>
    <div id="views-list"></div>
    <p class="empty" id="views-empty" hidden></p>
  </section>

  <!-- Qui m'a liké -->
  <section class="card" id="likes" hidden>
    <button class="back" id="likes-back" type="button" data-i18n="back"></button>
    <h2 data-i18n="likes_title"></h2>
    <div id="likes-list"></div>
    <p class="empty" id="likes-empty" hidden></p>
  </section>

  <!-- Conditions et confidentialité -->
  <section class="card" id="legal" hidden>
    <button class="back" id="legal-back" type="button" data-i18n="back"></button>
    <h2 data-i18n="legal_btn"></h2>
    <div id="legal-body" class="tips"></div>
  </section>

  <!-- Administration (réservée à l'admin) -->
  <section class="card" id="admin" hidden>
    <button class="back" id="admin-back" type="button">← Retour</button>
    <h2>Administration</h2>
    <div id="admin-stats" class="stats"></div>
    <button class="secondary" id="admin-diag" type="button">🩺 Vérifier l'installation</button>
    <div id="diag-out"></div>
    <h3>Membres</h3>
    <div class="chat-form" style="margin-bottom:10px">
      <input id="admin-q" type="search" placeholder="Prénom, ville ou identifiant (vide = les 50 derniers)">
      <button id="admin-search" type="button">Chercher</button>
    </div>
    <div id="admin-members"></div>
    <h3>🎉 Activités</h3>
    <details>
      <summary>Créer une activité</summary>
      <div class="evadmin">
        <input id="ev-title" type="text" maxlength="120" placeholder="Titre (ex. Atelier cuisine thaïe à deux)">
        <textarea id="ev-desc" maxlength="3000" placeholder="Description : programme, lieu de rendez-vous, ce qu'il faut apporter…"></textarea>
        <div class="two"><input id="ev-city" type="text" maxlength="60" placeholder="Ville"><select id="ev-country"></select></div>
        <small class="sub" style="margin:0">Date et heure dans le fuseau horaire de cet appareil (chaque membre la verra à son heure locale).</small>
        <div class="two"><input id="ev-start" type="datetime-local"><input id="ev-dur" type="number" min="0.5" max="240" step="0.5" value="2" placeholder="Durée (h)"></div>
        <div class="two"><input id="ev-cap" type="number" min="1" max="500" value="10" placeholder="Places"><input id="ev-price" type="number" min="0" step="0.01" value="0" placeholder="Prix (€)"></div>
        <select id="ev-level">
          <option value="0">Ouverte à tous</option>
          <option value="1">Réservée Premium et plus</option>
          <option value="2">Réservée Gold et plus</option>
          <option value="3">Réservée Diamond</option>
        </select>
        <button class="primary" id="ev-create" type="button">Publier l'activité</button>
      </div>
    </details>
    <div id="admin-events"></div>
    <h3>💎 Demandes Diamond</h3>
    <div id="admin-concierge"></div>
    <h3>Vérifications en attente</h3>
    <div id="admin-verifs"></div>
    <h3>Signalements à traiter</h3>
    <div id="admin-reports"></div>
    <div class="msg" id="admsg" role="status" aria-live="polite"></div>
  </section>

  <!-- Paramètres -->
  <section class="card" id="settings" hidden>
    <button class="back" id="settings-back" type="button" data-i18n="back"></button>
    <h2 data-i18n="settings_btn"></h2>
    <label class="check" for="pause">
      <input id="pause" type="checkbox">
      <span data-i18n="pause_label"></span>
    </label>
    <label for="newpw" data-i18n="new_pw"></label>
    <input id="newpw" type="password" minlength="8" autocomplete="new-password">
    <button class="secondary" id="change-pw" type="button" data-i18n="change_pw"></button>
    <div class="msg" id="smsg" role="status" aria-live="polite"></div>
    <button class="secondary" id="notif-btn" type="button" data-i18n="notif_btn" style="margin-top:16px"></button>
    <div class="msg" id="nmsg" role="status" aria-live="polite"></div>
    <h3 data-i18n="blocked_title" style="margin-top:22px"></h3>
    <div id="blocked-list"></div>
  </section>

  <!-- Fiche d'un match -->
  <section class="card" id="peer" hidden>
    <button class="back" id="peer-back" type="button" data-i18n="back"></button>
    <img id="peer-photo" class="view-photo" alt="" hidden>
    <h2 id="peer-name"></h2>
    <div id="peer-tags"></div>
    <p class="bio" id="peer-bio"></p>
  </section>

  <!-- Discussion -->
  <section class="card" id="chat" hidden>
    <button class="back" id="chat-back" type="button" data-i18n="back_matches"></button>
    <div class="head">
      <h2 id="chat-name" style="margin:0"></h2>
      <div class="head-actions">
        <button class="linkbtn" id="chat-profile" type="button" data-i18n="view_profile"></button>
        <button class="linkbtn" id="chat-video" type="button" data-i18n="video_btn"></button>
        <button class="linkbtn" id="chat-report" type="button" data-i18n="report"></button>
        <button class="linkbtn danger" id="chat-block" type="button" data-i18n="block"></button>
      </div>
    </div>
    <div class="chat-box" id="chat-box" aria-live="polite" style="margin-top:12px"></div>
    <div class="ice" id="ice" hidden>
      <div class="ice-t" data-i18n="ice_title"></div>
      <button type="button" class="chip" data-i18n="ice1"></button>
      <button type="button" class="chip" data-i18n="ice2"></button>
      <button type="button" class="chip" data-i18n="ice3"></button>
    </div>
    <form class="chat-form" id="chat-form">
      <input id="chat-input" type="text" maxlength="1000" data-i18n-ph="msg_ph" autocomplete="off">
      <button id="chat-send" type="submit" data-i18n="send"></button>
    </form>
    <div class="msg" id="cmsg" role="status" aria-live="polite"></div>
  </section>

  <!-- Signalement -->
  <section class="card" id="report" hidden>
    <button class="back" id="report-back" type="button" data-i18n="back"></button>
    <h2><span data-i18n="report_title"></span> <span id="report-name"></span></h2>
    <p class="sub" style="margin-bottom:0" data-i18n="report_sub"></p>
    <form id="report-form" novalidate>
      <label for="report-reason" data-i18n="reason"></label>
      <select id="report-reason">
        <option value="" data-i18n="choose"></option>
        <option value="faux_profil" data-i18n="r_fake"></option>
        <option value="arnaque" data-i18n="r_scam"></option>
        <option value="harcelement" data-i18n="r_harass"></option>
        <option value="contenu_inapproprie" data-i18n="r_content"></option>
        <option value="mineur" data-i18n="r_minor"></option>
        <option value="autre" data-i18n="r_other"></option>
      </select>
      <label for="report-details" data-i18n="details"></label>
      <textarea id="report-details" maxlength="1000"></textarea>
      <button class="primary" id="report-send" type="submit" data-i18n="send_report"></button>
      <div class="msg" id="rmsg" role="status" aria-live="polite"></div>
    </form>
  </section>

  <!-- Vérification -->
  <section class="card" id="verify" hidden>
    <button class="back" id="verify-back" type="button" data-i18n="back"></button>
    <h2 data-i18n="verify_title"></h2>
    <p class="sub" style="margin-bottom:8px" data-i18n="verify_text"></p>
    <p id="verify-status" style="font-weight:600"></p>
    <form id="verify-form" novalidate>
      <label for="verify-file" data-i18n="verify_file"></label>
      <input id="verify-file" type="file" accept="image/jpeg,image/png,image/webp">
      <button class="primary" id="verify-send" type="submit" data-i18n="verify_send"></button>
    </form>
    <div class="msg" id="vmsg" role="status" aria-live="polite"></div>
  </section>

  <!-- Sécurité -->
  <section class="card" id="safety" hidden>
    <button class="back" id="safety-back" type="button" data-i18n="back"></button>
    <h2 data-i18n="safety_title"></h2>
    <ul class="tips">
      <li data-i18n-rich="s1"></li>
      <li data-i18n-rich="s2"></li>
      <li data-i18n-rich="s3"></li>
      <li data-i18n-rich="s4"></li>
      <li data-i18n-rich="s5"></li>
      <li data-i18n-rich="s6"></li>
    </ul>
  </section>

  <p class="hint" data-i18n="hint"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/reglages.js"></script>
<script src="js/textes/fr.js"></script>
<script src="js/textes/en.js"></script>
<script src="js/textes/th.js"></script>
<script src="js/textes/vi.js"></script>
<script src="js/textes/zh.js"></script>
<script src="js/textes/id.js"></script>
<script src="js/textes/ja.js"></script>
<script src="js/textes/ko.js"></script>
<script src="js/textes/ms.js"></script>
<script src="js/textes/tl.js"></script>
<script src="js/textes/lo.js"></script>
<script src="js/textes/km.js"></script>
<script src="js/langue.js"></script>
