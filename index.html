<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#b8324f">
<title>Mon appli</title>
<style>
  :root {
    --bg: #f6f4f1; --card: #ffffff; --fg: #1d2330; --muted: #5d6677;
    --line: #dcd8d1; --accent: #b8324f; --accent-fg: #ffffff; --ok: #1f7a4d; --err: #b3261e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161c; --card: #1d2029; --fg: #eceff5; --muted: #a2aabb;
      --line: #343949; --accent: #e5627f; --accent-fg: #14161c; --ok: #5fd39a; --err: #ff8a80; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", "Noto Sans Thai", "Noto Sans", sans-serif;
    min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  main { width: 100%; max-width: 420px; }
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .topbar select { width: auto; padding: 6px 8px; font-size: .85rem; margin-top: 6px; }
  h1 { font-size: 1.9rem; margin: 0 0 4px; letter-spacing: -0.02em; text-wrap: balance; }
  h2 { margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 20px;
    background: var(--bg); padding: 4px; border-radius: 10px; }
  .tabs button { border: 0; background: transparent; color: var(--muted); padding: 10px;
    border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--fg);
    box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  label { display: block; font-size: .85rem; font-weight: 600; margin: 14px 0 6px; }
  input[type=email], input[type=password], input[type=date], input[type=text], input[type=number], select, textarea {
    width: 100%; padding: 12px; font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; }
  textarea { min-height: 110px; resize: vertical; }
  input:focus-visible, button:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; font-size: .9rem; color: var(--muted); font-weight: 400; }
  .check input { margin-top: 4px; }
  .primary { width: 100%; margin-top: 20px; padding: 13px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 700; cursor: pointer; }
  .primary:disabled { opacity: .6; cursor: wait; }
  .secondary { width: 100%; margin-top: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 10px;
    background: transparent; color: var(--fg); font: inherit; font-weight: 600; cursor: pointer; }
  .linkbtn { background: none; border: 0; color: var(--muted); font: inherit; font-size: .85rem; cursor: pointer;
    text-decoration: underline; padding: 6px 0; }
  .danger { color: var(--err); }
  .msg { margin-top: 16px; font-size: .92rem; min-height: 1.4em; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
  .hint { font-size: .8rem; color: var(--muted); margin-top: 18px; }
  .photo { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; background: var(--bg);
    border: 1px solid var(--line); display: block; margin: 0 auto 8px; }
  .photo-ph { display: grid; place-items: center; color: var(--muted); font-size: .8rem; text-align: center; }
  .view-photo { width: 100%; max-height: 360px; object-fit: cover; border-radius: 12px; margin-bottom: 16px; background: var(--bg); }
  .tag { display: inline-block; font-size: .8rem; color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 10px; margin: 0 6px 6px 0; }
  .tag.verified { color: var(--ok); border-color: var(--ok); font-weight: 600; }
  .bio { white-space: pre-wrap; margin: 12px 0 0; overflow-wrap: anywhere; }
  .count { font-size: .78rem; color: var(--muted); text-align: right; margin-top: 4px; }
  .chat-box { height: 340px; overflow-y: auto; background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .bubble { max-width: 80%; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble.me { align-self: flex-end; background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 4px; }
  .bubble.them { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .chat-form { display: flex; gap: 8px; margin-top: 12px; }
  .chat-form input { flex: 1; min-width: 0; padding: 12px; font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; }
  .chat-form button { padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-fg);
    font: inherit; font-weight: 700; cursor: pointer; }
  .chat-form button:disabled { opacity: .6; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .head-actions { display: flex; gap: 12px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row .primary, .row .secondary { margin-top: 12px; }
  .back { background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer; padding: 0 0 12px; }
  .empty { color: var(--muted); text-align: center; padding: 16px 0; }
  .match-banner { background: var(--accent); color: var(--accent-fg); border-radius: 12px; padding: 14px;
    text-align: center; font-weight: 700; margin-bottom: 14px; }
  .mrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .mrow:first-of-type { border-top: 0; }
  .mrow img, .mrow .mph { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: var(--bg); flex: none; }
  .mrow .mph { display: grid; place-items: center; color: var(--muted); font-weight: 700; }
  .mrow .mi { min-width: 0; flex: 1; }
  .mrow small { color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mrow.link { cursor: pointer; }
  .badge { background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 2px 9px; font-size: .75rem; font-weight: 700; flex: none; }
  details.filters { margin-bottom: 14px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  details.filters summary { cursor: pointer; font-weight: 600; font-size: .9rem; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tips { padding-left: 18px; margin: 8px 0 0; }
  .tips li { margin-bottom: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div>
      <h1 id="app-name">Mon appli</h1>
      <p class="sub" data-i18n="tagline"></p>
    </div>
    <select id="lang" aria-label="Langue / Language / ภาษา / Ngôn ngữ">
      <option value="fr">Français</option>
      <option value="en">English</option>
      <option value="th">ไทย</option>
      <option value="vi">Tiếng Việt</option>
      <option value="zh">中文</option>
      <option value="id">Bahasa Indonesia</option>
    </select>
  </div>

  <!-- Connexion / inscription -->
  <section class="card" id="auth">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-signup" aria-selected="true" type="button" data-i18n="tab_signup"></button>
      <button role="tab" id="tab-login" aria-selected="false" type="button" data-i18n="tab_login"></button>
    </div>
    <form id="form" novalidate>
      <label for="email" data-i18n="email"></label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password" data-i18n="password"></label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required>
      <div id="signup-only">
        <label for="birth" data-i18n="birth"></label>
        <input id="birth" type="date">
        <label class="check" for="adult">
          <input id="adult" type="checkbox">
          <span data-i18n="adult"></span>
        </label>
      </div>
      <button class="primary" id="submit" type="submit"></button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </form>
  </section>

  <!-- Formulaire de profil -->
  <section class="card" id="profile" hidden>
    <h2 data-i18n="profile_title"></h2>
    <p class="sub" style="margin-bottom:8px" data-i18n="profile_sub"></p>
    <form id="pform" novalidate>
      <img id="photo-prev" class="photo photo-ph" alt="" hidden>
      <div id="photo-empty" class="photo photo-ph" data-i18n="no_photo"></div>
      <label for="photo" data-i18n="photo_label"></label>
      <input id="photo" type="file" accept="image/jpeg,image/png,image/webp">

      <label for="first_name" data-i18n="first_name"></label>
      <input id="first_name" type="text" maxlength="40" autocomplete="given-name" required>

      <label for="country" data-i18n="country"></label>
      <select id="country"></select>

      <label for="gender" data-i18n="i_am"></label>
      <select id="gender">
        <option value="" data-i18n="choose"></option>
        <option value="homme" data-i18n="opt_man"></option>
        <option value="femme" data-i18n="opt_woman"></option>
        <option value="autre" data-i18n="opt_other"></option>
      </select>

      <label for="looking_for" data-i18n="looking"></label>
      <select id="looking_for">
        <option value="" data-i18n="choose"></option>
        <option value="homme" data-i18n="opt_man"></option>
        <option value="femme" data-i18n="opt_woman"></option>
        <option value="tous" data-i18n="opt_any"></option>
      </select>

      <label for="bio" data-i18n="bio"></label>
      <textarea id="bio" maxlength="500" data-i18n-ph="bio_ph"></textarea>
      <div class="count"><span id="bio-count">0</span> / 500</div>

      <button class="primary" id="psave" type="submit" data-i18n="save_profile"></button>
      <button class="secondary" id="pcancel" type="button" hidden data-i18n="cancel"></button>
      <div class="msg" id="pmsg" role="status" aria-live="polite"></div>
    </form>
  </section>

  <!-- Accueil / mon profil -->
  <section class="card" id="home" hidden>
    <img id="view-photo" class="view-photo" alt="" hidden>
    <h2 id="view-name"></h2>
    <div id="view-tags"></div>
    <p class="bio" id="view-bio"></p>
    <p class="sub" id="who" style="margin:16px 0 0;font-size:.85rem"></p>
    <button class="primary" id="go-discover" type="button" data-i18n="discover"></button>
    <button class="secondary" id="go-matches" type="button" data-i18n="matches"></button>
    <button class="secondary" id="edit" type="button" data-i18n="edit"></button>
    <button class="secondary" id="go-verify" type="button" data-i18n="verify_btn"></button>
    <button class="secondary" id="go-safety" type="button" data-i18n="safety_btn"></button>
    <button class="secondary" id="logout" type="button" data-i18n="logout"></button>
    <div style="text-align:center;margin-top:8px">
      <button class="linkbtn danger" id="delete-account" type="button" data-i18n="delete"></button>
    </div>
    <div class="msg" id="hmsg" role="status" aria-live="polite"></div>
  </section>

  <!-- Découverte -->
  <section class="card" id="discover" hidden>
    <button class="back" id="discover-back" type="button" data-i18n="back"></button>
    <details class="filters" id="filters">
      <summary data-i18n="filters"></summary>
      <div class="two">
        <div><label for="f-min" data-i18n="age_min"></label><input id="f-min" type="number" min="18" max="99" value="18"></div>
        <div><label for="f-max" data-i18n="age_max"></label><input id="f-max" type="number" min="18" max="99" value="99"></div>
      </div>
      <label for="f-country" data-i18n="country"></label>
      <select id="f-country"></select>
      <button class="secondary" id="f-apply" type="button" data-i18n="apply"></button>
    </details>
    <div class="match-banner" id="match-banner" hidden></div>
    <div id="cand" hidden>
      <img id="cand-photo" class="view-photo" alt="" hidden>
      <h2 id="cand-name"></h2>
      <div id="cand-tags"></div>
      <p class="bio" id="cand-bio"></p>
      <div class="row">
        <button class="secondary" id="pass" type="button" data-i18n="pass"></button>
        <button class="primary" id="like" type="button" data-i18n="like"></button>
      </div>
      <div style="text-align:center;margin-top:8px">
        <button class="linkbtn" id="cand-report" type="button" data-i18n="report_profile"></button>
      </div>
    </div>
    <p class="empty" id="cand-empty" hidden data-i18n="no_more"></p>
    <div class="msg" id="dmsg" role="status" aria-live="polite"></div>
  </section>

  <!-- Matchs -->
  <section class="card" id="matches" hidden>
    <button class="back" id="matches-back" type="button" data-i18n="back"></button>
    <h2 data-i18n="matches_title"></h2>
    <div id="matches-list"></div>
    <p class="empty" id="matches-empty" hidden></p>
  </section>

  <!-- Discussion -->
  <section class="card" id="chat" hidden>
    <button class="back" id="chat-back" type="button" data-i18n="back_matches"></button>
    <div class="head">
      <h2 id="chat-name" style="margin:0"></h2>
      <div class="head-actions">
        <button class="linkbtn" id="chat-report" type="button" data-i18n="report"></button>
        <button class="linkbtn danger" id="chat-block" type="button" data-i18n="block"></button>
      </div>
    </div>
    <div class="chat-box" id="chat-box" aria-live="polite" style="margin-top:12px"></div>
    <form class="chat-form" id="chat-form">
      <input id="chat-input" type="text" maxlength="1000" data-i18n-ph="msg_ph" autocomplete="off">
      <button id="chat-send" type="submit" data-i18n="send"></button>
    </form>
    <div class="msg" id="cmsg" role="status" aria-live="polite"></div>
  </section>

  <!-- Signalement -->
  <section class="card" id="report" hidden>
    <button class="back" id="report-back" type="button" data-i18n="back"></button>
    <h2><span data-i18n="report_title"></span> <span id="report-name"></span></h2>
    <p class="sub" style="margin-bottom:0" data-i18n="report_sub"></p>
    <form id="report-form" novalidate>
      <label for="report-reason" data-i18n="reason"></label>
      <select id="report-reason">
        <option value="" data-i18n="choose"></option>
        <option value="faux_profil" data-i18n="r_fake"></option>
        <option value="arnaque" data-i18n="r_scam"></option>
        <option value="harcelement" data-i18n="r_harass"></option>
        <option value="contenu_inapproprie" data-i18n="r_content"></option>
        <option value="mineur" data-i18n="r_minor"></option>
        <option value="autre" data-i18n="r_other"></option>
      </select>
      <label for="report-details" data-i18n="details"></label>
      <textarea id="report-details" maxlength="1000"></textarea>
      <button class="primary" id="report-send" type="submit" data-i18n="send_report"></button>
      <div class="msg" id="rmsg" role="status" aria-live="polite"></div>
    </form>
  </section>

  <!-- Vérification -->
  <section class="card" id="verify" hidden>
    <button class="back" id="verify-back" type="button" data-i18n="back"></button>
    <h2 data-i18n="verify_title"></h2>
    <p class="sub" style="margin-bottom:8px" data-i18n="verify_text"></p>
    <p id="verify-status" style="font-weight:600"></p>
    <form id="verify-form" novalidate>
      <label for="verify-file" data-i18n="verify_file"></label>
      <input id="verify-file" type="file" accept="image/jpeg,image/png,image/webp">
      <button class="primary" id="verify-send" type="submit" data-i18n="verify_send"></button>
    </form>
    <div class="msg" id="vmsg" role="status" aria-live="polite"></div>
  </section>

  <!-- Sécurité -->
  <section class="card" id="safety" hidden>
    <button class="back" id="safety-back" type="button" data-i18n="back"></button>
    <h2 data-i18n="safety_title"></h2>
    <ul class="tips">
      <li data-i18n-rich="s1"></li>
      <li data-i18n-rich="s2"></li>
      <li data-i18n-rich="s3"></li>
      <li data-i18n-rich="s4"></li>
      <li data-i18n-rich="s5"></li>
      <li data-i18n-rich="s6"></li>
    </ul>
  </section>

  <p class="hint" data-i18n="hint"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

      if (f) {
        if (!/^image\/(jpeg|png|webp)$/.test(f.type)) throw new Error(t("e_photo_type"));
        if (f.size > 5 * 1024 * 1024) throw new Error(t("e_photo_size"));
        var path = currentUser.id + "/avatar";
        var up = await db.storage.from("photos").upload(path, f, { upsert: true, contentType: f.type });
        if (up.error) throw up.error;
        photoPath = path;
      }
      var bd = (currentProfile && currentProfile.birthdate) || (currentUser.user_metadata || {}).birthdate || null;
      var row = {
        id: currentUser.id,
        first_name: name,
        country: $("country").value || null,
        gender: $("gender").value,
        looking_for: $("looking_for").value,
        bio: $("bio").value.trim() || null,
        photo_path: photoPath,
        birthdate: bd,
        updated_at: new Date().toISOString()
      };
      var s = await db.from("profiles").upsert(row).select().single();
      if (s.error) throw s.error;
      currentProfile = s.data;
      renderView(currentUser, s.data);
    } catch (err) { say(msg, err.message || t("e_generic"), "err"); }
    $("psave").disabled = false;
  });

  // ---------- Découverte ----------
  var candidate = null;

  function renderCandidate() {
    $("cand-name").textContent = nameWithAge(candidate);
    tagsInto($("cand-tags"), candidate);
    $("cand-bio").textContent = candidate.bio || "";
    var url = photoUrl(candidate), img = $("cand-photo");
    if (url) { img.src = url; img.hidden = false; } else { img.hidden = true; img.removeAttribute("src"); }
    $("cand").hidden = false;
  }

  async function nextCandidate() {
    var dmsg = $("dmsg"); say(dmsg, t("searching"), "");
    $("cand").hidden = true; $("cand-empty").hidden = true;
    var s = await db.from("swipes").select("to_id").eq("from_id", currentUser.id);
    if (s.error) return say(dmsg, s.error.message, "err");
    var seen = (s.data || []).map(function (x) { return x.to_id; });
    seen.push(currentUser.id);
    var q = db.from("profiles").select("*")
      .not("id", "in", "(" + seen.join(",") + ")")
      .in("looking_for", [currentProfile.gender, "tous"])
      .order("created_at", { ascending: false }).limit(1);
    if (currentProfile.looking_for !== "tous") q = q.eq("gender", currentProfile.looking_for);
    var amin = parseInt($("f-min").value, 10), amax = parseInt($("f-max").value, 10);
    if (amin > 18) q = q.lte("birthdate", dateYearsAgo(amin));
    if (amax < 99) q = q.gt("birthdate", dateYearsAgo(amax + 1));
    if ($("f-country").value) q = q.eq("country", $("f-country").value);
    var r = await q;
    if (r.error) return say(dmsg, r.error.message, "err");
    say(dmsg, "", "");
    candidate = r.data && r.data[0];
    if (!candidate) { $("cand-empty").hidden = false; return; }
    renderCandidate();
  }

  async function swipe(liked) {
    if (!candidate) return;
    $("like").disabled = $("pass").disabled = true;
    var dmsg = $("dmsg"), banner = $("match-banner");
    banner.hidden = true;
    try {
      var ins = await db.from("swipes").insert({ from_id: currentUser.id, to_id: candidate.id, liked: liked });
      if (ins.error) throw ins.error;
      if (liked) {
        var back = await db.from("swipes").select("liked")
          .eq("from_id", candidate.id).eq("to_id", currentUser.id).eq("liked", true).maybeSingle();
        if (back.data) { banner.textContent = t("match_with", { name: candidate.first_name }); banner.hidden = false; }
      }
      await nextCandidate();
    } catch (err) { say(dmsg, err.message || t("e_generic"), "err"); }
    $("like").disabled = $("pass").disabled = false;
  }

  $("go-discover").onclick = function () { $("match-banner").hidden = true; showSection("discover"); nextCandidate(); };
  $("f-apply").onclick = function () { $("filters").open = false; $("match-banner").hidden = true; nextCandidate(); };
  $("discover-back").onclick = function () { showSection("home"); };
  $("like").onclick = function () { swipe(true); };
  $("pass").onclick = function () { swipe(false); };

  // ---------- Matchs (avec aperçu et messages non lus) ----------
  function readMap() { try { return JSON.parse(localStorage.getItem("lastread:" + currentUser.id) || "{}"); } catch (e) { return {}; } }
  function markRead(peerId) {
    try { var m = readMap(); m[peerId] = new Date().toISOString(); localStorage.setItem("lastread:" + currentUser.id, JSON.stringify(m)); } catch (e) {}
  }

  async function loadMatches() {
    var list = $("matches-list"); list.textContent = ""; $("matches-empty").hidden = true;
    var me = currentUser.id;
    var a = await db.from("swipes").select("to_id").eq("from_id", me).eq("liked", true);
    var b = await db.from("swipes").select("from_id").eq("to_id", me).eq("liked", true);
    if (a.error || b.error) { $("matches-empty").textContent = t("matches_err"); $("matches-empty").hidden = false; return; }
    var mine = (a.data || []).map(function (x) { return x.to_id; });
    var ids = (b.data || []).map(function (x) { return x.from_id; }).filter(function (id) { return mine.indexOf(id) !== -1; });
    var people = [];
    if (ids.length) {
      var r = await db.from("profiles").select("*").in("id", ids);   // les personnes bloquées n'apparaissent plus
      people = r.data || [];
    }
    if (!people.length) { $("matches-empty").textContent = t("matches_empty"); $("matches-empty").hidden = false; return; }

    var last = {};
    var mm = await db.from("messages").select("from_id,to_id,body,created_at")
      .or("from_id.eq." + me + ",to_id.eq." + me).order("created_at", { ascending: false }).limit(300);
    (mm.data || []).forEach(function (m) { var peer = m.from_id === me ? m.to_id : m.from_id; if (!last[peer]) last[peer] = m; });
    var seenAt = readMap();
    people.sort(function (x, y) {
      var lx = last[x.id] ? last[x.id].created_at : "", ly = last[y.id] ? last[y.id].created_at : "";
      return lx < ly ? 1 : lx > ly ? -1 : 0;
    });

    people.forEach(function (p) {
      var row = document.createElement("div"); row.className = "mrow link"; row.setAttribute("role", "button"); row.tabIndex = 0;
      var url = photoUrl(p), pic;
      if (url) { pic = document.createElement("img"); pic.src = url; pic.alt = ""; }
      else { pic = document.createElement("div"); pic.className = "mph"; pic.textContent = p.first_name.charAt(0).toUpperCase(); }
      var info = document.createElement("div"); info.className = "mi";
      var strong = document.createElement("strong"); strong.textContent = nameWithAge(p) + (p.verified ? " ✓" : "");
      var small = document.createElement("small");
      var lm = last[p.id];
      small.textContent = lm ? (lm.from_id === me ? t("you") : "") + lm.body : (p.country ? countryLabel(p.country) : "");
      info.appendChild(strong); info.appendChild(small);
      row.appendChild(pic); row.appendChild(info);
      if (lm && lm.from_id !== me && (!seenAt[p.id] || lm.created_at > seenAt[p.id])) {
        var bd = document.createElement("span"); bd.className = "badge"; bd.textContent = t("new_badge"); row.appendChild(bd);
      }
      row.onclick = function () { openChat(p); };
      row.onkeydown = function (e) { if (e.key === "Enter") openChat(p); };
      list.appendChild(row);
    });
  }
  $("go-matches").onclick = function () { showSection("matches"); loadMatches(); };
  $("matches-back").onclick = function () { showSection("home"); };

  // ---------- Messagerie ----------
  var chatWith = null, chatTimer = null, lastCount = -1;

  function stopChat() { if (chatTimer) { clearInterval(chatTimer); chatTimer = null; } }

  async function refreshChat() {
    if (!chatWith || !currentUser) return;
    var me = currentUser.id, other = chatWith.id;
    var r = await db.from("messages").select("*")
      .or("and(from_id.eq." + me + ",to_id.eq." + other + "),and(from_id.eq." + other + ",to_id.eq." + me + ")")
      .order("created_at", { ascending: true }).limit(200);
    if (r.error) return say($("cmsg"), r.error.message, "err");
    var box = $("chat-box");
    var stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
    box.textContent = "";
    (r.data || []).forEach(function (m) {
      var d = document.createElement("div");
      d.className = "bubble " + (m.from_id === me ? "me" : "them");
      d.textContent = m.body;
      box.appendChild(d);
    });
    if (stick || lastCount !== (r.data || []).length) box.scrollTop = box.scrollHeight;
    lastCount = (r.data || []).length;
    markRead(other);
  }

  function openChat(p) {
    chatWith = p; lastCount = -1;
    $("chat-name").textContent = p.first_name;
    $("chat-box").textContent = ""; $("chat-input").value = "";
    say($("cmsg"), "", "");
    showSection("chat");
    markRead(p.id);
    refreshChat();
    stopChat();
    chatTimer = setInterval(refreshChat, 4000);
  }

  $("chat-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var text = $("chat-input").value.trim();
    if (!text || !chatWith) return;
    $("chat-send").disabled = true;
    var r = await db.from("messages").insert({ from_id: currentUser.id, to_id: chatWith.id, body: text });
    if (r.error) say($("cmsg"), t("e_send") + r.error.message, "err");
    else { $("chat-input").value = ""; say($("cmsg"), "", ""); await refreshChat(); }
    $("chat-send").disabled = false;
  });
  $("chat-back").onclick = function () { showSection("matches"); loadMatches(); };

  // ---------- Signaler / bloquer ----------
  var reportTarget = null, reportReturn = "home";

  function openReport(p, ret) {
    reportTarget = p; reportReturn = ret;
    $("report-name").textContent = p.first_name;
    $("report-reason").value = ""; $("report-details").value = "";
    say($("rmsg"), "", "");
    showSection("report");
  }
  $("cand-report").onclick = function () { if (candidate) openReport(candidate, "discover"); };
  $("chat-report").onclick = function () { if (chatWith) openReport(chatWith, "chat"); };
  $("report-back").onclick = function () { showSection(reportReturn); };

  $("report-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!$("report-reason").value) return say($("rmsg"), t("e_reason"), "err");
    $("report-send").disabled = true;
    var r = await db.from("reports").insert({
      reporter_id: currentUser.id, reported_id: reportTarget.id,
      reason: $("report-reason").value, details: $("report-details").value.trim() || null
    });
    if (r.error) say($("rmsg"), t("e_send") + r.error.message, "err");
    else {
      say($("rmsg"), t("ok_report"), "ok");
      setTimeout(function () { if (!$("report").hidden) showSection(reportReturn); }, 2200);
    }
    $("report-send").disabled = false;
  });

  $("chat-block").onclick = async function () {
    if (!chatWith) return;
    if (!confirm(t("block_confirm", { name: chatWith.first_name }))) return;
    var r = await db.from("blocks").insert({ blocker_id: currentUser.id, blocked_id: chatWith.id });
    if (r.error) return say($("cmsg"), t("e_block") + r.error.message, "err");
    chatWith = null;
    showSection("matches"); loadMatches();
  };

  // ---------- Vérification du profil ----------
  function renderVerifyStatus() {
    var st = $("verify-status"), form = $("verify-form");
    if (currentProfile && currentProfile.verified) { st.textContent = t("verify_status_ok"); st.style.color = "var(--ok)"; form.hidden = true; }
    else if (currentProfile && currentProfile.verification_requested) { st.textContent = t("verify_status_pending"); st.style.color = "var(--muted)"; form.hidden = false; }
    else { st.textContent = ""; form.hidden = false; }
  }
  $("go-verify").onclick = function () { $("verify-file").value = ""; say($("vmsg"), "", ""); renderVerifyStatus(); showSection("verify"); };
  $("verify-back").onclick = function () { showSection("home"); };

  $("verify-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var f = $("verify-file").files[0], msg = $("vmsg");
    if (!f) return say(msg, t("e_verify_file"), "err");
    if (!/^image\/(jpeg|png|webp)$/.test(f.type)) return say(msg, t("e_photo_type"), "err");
    if (f.size > 5 * 1024 * 1024) return say(msg, t("e_photo_size"), "err");
    $("verify-send").disabled = true; say(msg, t("wait"), "");
    try {
      var up = await db.storage.from("verifications").upload(currentUser.id + "/selfie", f, { upsert: true, contentType: f.type });
      if (up.error) throw up.error;
      var u = await db.from("profiles").update({ verification_requested: true }).eq("id", currentUser.id).select().single();
      if (u.error) throw u.error;
      currentProfile = u.data;
      say(msg, t("verify_sent"), "ok"); renderVerifyStatus();
    } catch (err) { say(msg, err.message || t("e_generic"), "err"); }
    $("verify-send").disabled = false;
  });

  // ---------- Sécurité, déconnexion, suppression ----------
  $("go-safety").onclick = function () { showSection("safety"); };
  $("safety-back").onclick = function () { showSection("home"); };

  $("logout").onclick = async function () { await db.auth.signOut(); show(null); setMode("login"); };

  $("delete-account").onclick = async function () {
    if (!confirm(t("delete_confirm"))) return;
    var hmsg = $("hmsg"); say(hmsg, t("deleting"), "");
    try {
      var uid = currentUser.id, buckets = ["photos", "verifications"];
      for (var i = 0; i < buckets.length; i++) {
        var l = await db.storage.from(buckets[i]).list(uid);
        if (l.data && l.data.length) {
          await db.storage.from(buckets[i]).remove(l.data.map(function (f) { return uid + "/" + f.name; }));
        }
      }
      var r = await db.rpc("delete_my_account");
      if (r.error) throw r.error;
      try { await db.auth.signOut({ scope: "local" }); } catch (x) {}
      show(null); setMode("signup");
      say($("msg"), t("deleted"), "ok");
    } catch (err) { say(hmsg, t("e_delete") + (err.message || err), "err"); }
  };

  applyI18n();
  setMode("signup");
  db.auth.getSession().then(function (r) { show(r.data.session ? r.data.session.user : null); });
</script>
</body>
</html>
