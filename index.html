<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f7a5c">
<link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Jade</title>
<style>
  :root {
    --bg: #f6f4f1; --card: #ffffff; --fg: #1d2330; --muted: #5d6677;
    --line: #dcd8d1; --accent: #1f7a5c; --accent-fg: #ffffff; --ok: #1f7a4d; --err: #b3261e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161c; --card: #1d2029; --fg: #eceff5; --muted: #a2aabb;
      --line: #343949; --accent: #5fd3a0; --accent-fg: #14161c; --ok: #5fd39a; --err: #ff8a80; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", "Hiragino Sans", "Noto Sans JP", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans Thai", "Noto Sans Lao", "Noto Sans Khmer", "Khmer Sangam MN", "Lao Sangam MN", "Noto Sans", sans-serif;
    min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  main { width: 100%; max-width: 420px; }
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .topbar select { width: auto; padding: 6px 8px; font-size: .85rem; margin-top: 6px; }
  h1 { font-size: 1.9rem; margin: 0 0 4px; letter-spacing: -0.02em; text-wrap: balance; }
  h2 { margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 20px;
    background: var(--bg); padding: 4px; border-radius: 10px; }
  .tabs button { border: 0; background: transparent; color: var(--muted); padding: 10px;
    border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--fg);
    box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  label { display: block; font-size: .85rem; font-weight: 600; margin: 14px 0 6px; }
  input[type=email], input[type=password], input[type=date], input[type=text], input[type=number], select, textarea {
    width: 100%; padding: 12px; font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; }
  textarea { min-height: 110px; resize: vertical; }
  input:focus-visible, button:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; font-size: .9rem; color: var(--muted); font-weight: 400; }
  .check input { margin-top: 4px; }
  .primary { width: 100%; margin-top: 20px; padding: 13px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 700; cursor: pointer; }
  .primary:disabled { opacity: .6; cursor: wait; }
  .secondary { width: 100%; margin-top: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 10px;
    background: transparent; color: var(--fg); font: inherit; font-weight: 600; cursor: pointer; }
  .linkbtn { background: none; border: 0; color: var(--muted); font: inherit; font-size: .85rem; cursor: pointer;
    text-decoration: underline; padding: 6px 0; }
  .danger { color: var(--err); }
  .msg { margin-top: 16px; font-size: .92rem; min-height: 1.4em; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
  .hint { font-size: .8rem; color: var(--muted); margin-top: 18px; }
  .photo { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; background: var(--bg);
    border: 1px solid var(--line); display: block; margin: 0 auto 8px; }
  .photo-ph { display: grid; place-items: center; color: var(--muted); font-size: .8rem; text-align: center; }
  .slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 12px; }
  .slot { position: relative; aspect-ratio: 3/4; border: 1.5px dashed var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--accent); font-size: 1.6rem; }
  .slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slot input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .slot .x { position: absolute; top: 2px; right: 2px; width: 24px; height: 24px; padding: 0; border-radius: 50%; border: 0; background: rgba(0,0,0,.65); color: #fff; font-size: .8rem; line-height: 24px; z-index: 2; cursor: pointer; }
  .gcount { text-align: center; font-size: .8rem; opacity: .7; margin: -10px 0 12px; }
  .arow { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
  .arow img { width: 96px; height: 128px; object-fit: cover; border-radius: 8px; background: var(--bg); }
  .arow .ainfo { flex: 1; min-width: 160px; font-size: .9rem; }
  .arow .abtns button { width: auto; display: inline-block; margin: 6px 6px 0 0; padding: 8px 12px; }
  .hero { text-align: center; margin: -4px 0 20px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
  .hero-logo { width: 72px; height: 72px; border-radius: 18px; display: block; margin: 0 auto 12px; box-shadow: 0 6px 18px rgba(31,122,92,.25); }
  .hero-title { font-size: 1.25rem; line-height: 1.35; margin: 0 0 12px; }
  .hero-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: .95rem; color: var(--muted); }
  .hero-list li::before { content: "◆ "; color: #c9a24a; }
  .langs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .langs label { display: inline-flex; align-items: center; gap: 6px; margin: 0; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: .9rem; font-weight: 500; cursor: pointer; }
  .langs input { width: auto; margin: 0; }
  .tag.online { border-color: var(--ok); color: var(--ok); }
  .bwrap { display: flex; flex-direction: column; max-width: 80%; }
  .bwrap.me { align-self: flex-end; align-items: flex-end; }
  .bwrap.them { align-self: flex-start; align-items: flex-start; }
  .bwrap .bubble { max-width: 100%; }
  .bmeta { font-size: .72rem; color: var(--muted); margin: 2px 6px 0; }
  .bmeta a { color: var(--accent); }
  .ice { margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .ice-t { width: 100%; font-size: .85rem; color: var(--muted); }
  .chip { width: auto; margin: 0; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font-size: .85rem; font-weight: 500; cursor: pointer; }
  .view-photo { width: 100%; max-height: 360px; object-fit: cover; border-radius: 12px; margin-bottom: 16px; background: var(--bg); }
  .tag { display: inline-block; font-size: .8rem; color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 10px; margin: 0 6px 6px 0; }
  .tag.verified { color: var(--ok); border-color: var(--ok); font-weight: 600; }
  .bio { white-space: pre-wrap; margin: 12px 0 0; overflow-wrap: anywhere; }
  .count { font-size: .78rem; color: var(--muted); text-align: right; margin-top: 4px; }
  .chat-box { height: 340px; overflow-y: auto; background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .bubble { max-width: 80%; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble.me { align-self: flex-end; background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 4px; }
  .bubble.them { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .chat-form { display: flex; gap: 8px; margin-top: 12px; }
  .chat-form input { flex: 1; min-width: 0; padding: 12px; font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; }
  .chat-form button { padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-fg);
    font: inherit; font-weight: 700; cursor: pointer; }
  .chat-form button:disabled { opacity: .6; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .head-actions { display: flex; gap: 12px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row .primary, .row .secondary { margin-top: 12px; }
  .back { background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer; padding: 0 0 12px; }
  .empty { color: var(--muted); text-align: center; padding: 16px 0; }
  .match-banner { background: var(--accent); color: var(--accent-fg); border-radius: 12px; padding: 14px;
    text-align: center; font-weight: 700; margin-bottom: 14px; }
  .mrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .mrow:first-of-type { border-top: 0; }
  .mrow img, .mrow .mph { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: var(--bg); flex: none; }
  .mrow .mph { display: grid; place-items: center; color: var(--muted); font-weight: 700; }
  .mrow .mi { min-width: 0; flex: 1; }
  .mrow small { color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mrow.link { cursor: pointer; }
  .badge { background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 2px 9px; font-size: .75rem; font-weight: 700; flex: none; }
  details.filters { margin-bottom: 14px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  details.filters summary { cursor: pointer; font-weight: 600; font-size: .9rem; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tips { padding-left: 18px; margin: 8px 0 0; }
  .tips li { margin-bottom: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div>
      <h1 id="app-name">Jade</h1>
      <p class="sub" data-i18n="tagline"></p>
    </div>
    <select id="lang" aria-label="Langue / Language / ภาษา / Ngôn ngữ">
      <option value="fr">Français</option>
      <option value="en">English</option>
      <option value="th">ไทย</option>
      <option value="vi">Tiếng Việt</option>
      <option value="zh">中文</option>
      <option value="id">Bahasa Indonesia</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="ms">Bahasa Melayu</option>
      <option value="tl">Filipino</option>
      <option value="lo">ລາວ</option>
      <option value="km">ខ្មែរ</option>
    </select>
  </div>

  <!-- Connexion / inscription -->
  <section class="card" id="auth">
    <div class="hero">
      <img src="icon-180.png" alt="" class="hero-logo">
      <h2 class="hero-title" data-i18n="hero_title"></h2>
      <ul class="hero-list">
        <li data-i18n="hero_f1"></li>
        <li data-i18n="hero_f2"></li>
        <li data-i18n="hero_f3"></li>
      </ul>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-signup" aria-selected="true" type="button" data-i18n="tab_signup"></button>
      <button role="tab" id="tab-login" aria-selected="false" type="button" data-i18n="tab_login"></button>
    </div>
    <form id="form" novalidate>
      <label for="email" data-i18n="email"></label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password" data-i18n="password"></label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required>
      <div id="signup-only">
        <label for="birth" data-i18n="birth"></label>
        <input id="birth" type="date">
        <label class="check" for="adult">
          <input id="adult" type="checkbox">
          <span data-i18n="adult"></span>
        </label>
        <button class="linkbtn" id="legal-link-auth" type="button" data-i18n="legal_btn"></button>
      </div>
      <button class="primary" id="submit" type="submit"></button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </form>
  </section>

  <!-- Formulaire de profil -->
  <section class="card" id="profile" hidden>
    <h2 data-i18n="profile_title"></h2>
    <p class="sub" style="margin-bottom:8px" data-i18n="profile_sub"></p>
    <form id="pform" novalidate>
      <label data-i18n="photos_label"></label>
      <div id="slots" class="slots"></div>

      <label for="first_name" data-i18n="first_name"></label>
      <input id="first_name" type="text" maxlength="40" autocomplete="given-name" required>

      <label for="country" data-i18n="country"></label>
      <select id="country"></select>

      <label for="gender" data-i18n="i_am"></label>
      <select id="gender">
        <option value="" data-i18n="choose"></option>
        <option value="homme" data-i18n="opt_man"></option>
        <option value="femme" data-i18n="opt_woman"></option>
        <option value="autre" data-i18n="opt_other"></option>
      </select>

      <label for="looking_for" data-i18n="looking"></label>
      <select id="looking_for">
        <option value="" data-i18n="choose"></option>
        <option value="homme" data-i18n="opt_man"></option>
        <option value="femme" data-i18n="opt_woman"></option>
        <option value="tous" data-i18n="opt_any"></option>
      </select>

      <label for="city" data-i18n="city"></label>
      <input id="city" type="text" maxlength="40" autocomplete="address-level2">

      <label for="intention" data-i18n="intent"></label>
      <select id="intention">
        <option value="" data-i18n="choose"></option>
        <option value="serieux" data-i18n="i_serieux"></option>
        <option value="mariage" data-i18n="i_mariage"></option>
        <option value="amitie" data-i18n="i_amitie"></option>
        <option value="voir" data-i18n="i_voir"></option>
      </select>

      <label data-i18n="spoken"></label>
      <div id="spoken" class="langs"></div>

      <label for="bio" data-i18n="bio"></label>
      <textarea id="bio" maxlength="500" data-i18n-ph="bio_ph"></textarea>
      <div class="count"><span id="bio-count">0</span> / 500</div>

      <button class="primary" id="psave" type="submit" data-i18n="save_profile"></button>
      <button class="secondary" id="pcancel" type="button" hidden data-i18n="cancel"></button>
      <div class="msg" id="pmsg" role="status" aria-live="polite"></div>
    </form>
  </section>

  <!-- Accueil / mon profil -->
  <section class="card" id="home" hidden>
    <img id="view-photo" class="view-photo" alt="" hidden>
    <h2 id="view-name"></h2>
    <div id="view-tags"></div>
    <p class="bio" id="view-bio"></p>
    <p class="sub" id="who" style="margin:16px 0 0;font-size:.85rem"></p>
    <button class="primary" id="go-discover" type="button" data-i18n="discover"></button>
    <button class="secondary" id="go-matches" type="button" data-i18n="matches"></button>
    <button class="secondary" id="go-likes" type="button" data-i18n="likes_btn"></button>
    <button class="secondary" id="edit" type="button" data-i18n="edit"></button>
    <button class="secondary" id="go-verify" type="button" data-i18n="verify_btn"></button>
    <button class="secondary" id="go-safety" type="button" data-i18n="safety_btn"></button>
    <button class="secondary" id="go-legal" type="button" data-i18n="legal_btn"></button>
    <button class="secondary" id="go-admin" type="button" hidden>Administration</button>
    <button class="secondary" id="logout" type="button" data-i18n="logout"></button>
    <div style="text-align:center;margin-top:8px">
      <button class="linkbtn danger" id="delete-account" type="button" data-i18n="delete"></button>
    </div>
    <div class="msg" id="hmsg" role="status" aria-live="polite"></div>
  </section>

  <!-- Découverte -->
  <section class="card" id="discover" hidden>
    <button class="back" id="discover-back" type="button" data-i18n="back"></button>
    <details class="filters" id="filters">
      <summary data-i18n="filters"></summary>
      <div class="two">
        <div><label for="f-min" data-i18n="age_min"></label><input id="f-min" type="number" min="18" max="99" value="18"></div>
        <div><label for="f-max" data-i18n="age_max"></label><input id="f-max" type="number" min="18" max="99" value="99"></div>
      </div>
      <label for="f-country" data-i18n="country"></label>
      <select id="f-country"></select>
      <div class="two">
        <div><label for="f-intent" data-i18n="intent"></label>
          <select id="f-intent">
            <option value="" data-i18n="all_intents"></option>
            <option value="serieux" data-i18n="i_serieux"></option>
            <option value="mariage" data-i18n="i_mariage"></option>
            <option value="amitie" data-i18n="i_amitie"></option>
            <option value="voir" data-i18n="i_voir"></option>
          </select></div>
        <div><label for="f-lang" data-i18n="filter_lang"></label><select id="f-lang"></select></div>
      </div>
      <button class="secondary" id="f-apply" type="button" data-i18n="apply"></button>
    </details>
    <div class="match-banner" id="match-banner" hidden></div>
    <div id="cand" hidden>
      <img id="cand-photo" class="view-photo" alt="" hidden>
      <h2 id="cand-name"></h2>
      <div id="cand-tags"></div>
      <p class="bio" id="cand-bio"></p>
      <div class="row">
        <button class="secondary" id="pass" type="button" data-i18n="pass"></button>
        <button class="primary" id="like" type="button" data-i18n="like"></button>
      </div>
      <div style="text-align:center;margin-top:8px">
        <button class="linkbtn" id="cand-report" type="button" data-i18n="report_profile"></button>
      </div>
    </div>
    <p class="empty" id="cand-empty" hidden data-i18n="no_more"></p>
    <div class="msg" id="dmsg" role="status" aria-live="polite"></div>
  </section>

  <!-- Matchs -->
  <section class="card" id="matches" hidden>
    <button class="back" id="matches-back" type="button" data-i18n="back"></button>
    <h2 data-i18n="matches_title"></h2>
    <div id="matches-list"></div>
    <p class="empty" id="matches-empty" hidden></p>
  </section>

  <!-- Qui m'a liké -->
  <section class="card" id="likes" hidden>
    <button class="back" id="likes-back" type="button" data-i18n="back"></button>
    <h2 data-i18n="likes_title"></h2>
    <div id="likes-list"></div>
    <p class="empty" id="likes-empty" hidden></p>
  </section>

  <!-- Conditions et confidentialité -->
  <section class="card" id="legal" hidden>
    <button class="back" id="legal-back" type="button" data-i18n="back"></button>
    <h2 data-i18n="legal_btn"></h2>
    <div id="legal-body" class="tips"></div>
  </section>

  <!-- Administration (réservée à l'admin) -->
  <section class="card" id="admin" hidden>
    <button class="back" id="admin-back" type="button">← Retour</button>
    <h2>Administration</h2>
    <h3>Vérifications en attente</h3>
    <div id="admin-verifs"></div>
    <h3>Signalements à traiter</h3>
    <div id="admin-reports"></div>
    <div class="msg" id="admsg" role="status" aria-live="polite"></div>
  </section>

  <!-- Discussion -->
  <section class="card" id="chat" hidden>
    <button class="back" id="chat-back" type="button" data-i18n="back_matches"></button>
    <div class="head">
      <h2 id="chat-name" style="margin:0"></h2>
      <div class="head-actions">
        <button class="linkbtn" id="chat-report" type="button" data-i18n="report"></button>
        <button class="linkbtn danger" id="chat-block" type="button" data-i18n="block"></button>
      </div>
    </div>
    <div class="chat-box" id="chat-box" aria-live="polite" style="margin-top:12px"></div>
    <div class="ice" id="ice" hidden>
      <div class="ice-t" data-i18n="ice_title"></div>
      <button type="button" class="chip" data-i18n="ice1"></button>
      <button type="button" class="chip" data-i18n="ice2"></button>
      <button type="button" class="chip" data-i18n="ice3"></button>
    </div>
    <form class="chat-form" id="chat-form">
      <input id="chat-input" type="text" maxlength="1000" data-i18n-ph="msg_ph" autocomplete="off">
      <button id="chat-send" type="submit" data-i18n="send"></button>
    </form>
    <div class="msg" id="cmsg" role="status" aria-live="polite"></div>
  </section>

  <!-- Signalement -->
  <section class="card" id="report" hidden>
    <button class="back" id="report-back" type="button" data-i18n="back"></button>
    <h2><span data-i18n="report_title"></span> <span id="report-name"></span></h2>
    <p class="sub" style="margin-bottom:0" data-i18n="report_sub"></p>
    <form id="report-form" novalidate>
      <label for="report-reason" data-i18n="reason"></label>
      <select id="report-reason">
        <option value="" data-i18n="choose"></option>
        <option value="faux_profil" data-i18n="r_fake"></option>
        <option value="arnaque" data-i18n="r_scam"></option>
        <option value="harcelement" data-i18n="r_harass"></option>
        <option value="contenu_inapproprie" data-i18n="r_content"></option>
        <option value="mineur" data-i18n="r_minor"></option>
        <option value="autre" data-i18n="r_other"></option>
      </select>
      <label for="report-details" data-i18n="details"></label>
      <textarea id="report-details" maxlength="1000"></textarea>

    try { var m = readMap(); m[peerId] = new Date().toISOString(); localStorage.setItem("lastread:" + currentUser.id, JSON.stringify(m)); } catch (e) {}
  }

  async function loadMatches() {
    var list = $("matches-list"); list.textContent = ""; $("matches-empty").hidden = true;
    var me = currentUser.id;
    var a = await db.from("swipes").select("to_id").eq("from_id", me).eq("liked", true);
    var b = await db.from("swipes").select("from_id").eq("to_id", me).eq("liked", true);
    if (a.error || b.error) { $("matches-empty").textContent = t("matches_err"); $("matches-empty").hidden = false; return; }
    var mine = (a.data || []).map(function (x) { return x.to_id; });
    var ids = (b.data || []).map(function (x) { return x.from_id; }).filter(function (id) { return mine.indexOf(id) !== -1; });
    var people = [];
    if (ids.length) {
      var r = await db.from("profiles").select("*").in("id", ids).eq("suspended", false);   // les personnes bloquées n'apparaissent plus
      people = r.data || [];
    }
    if (!people.length) { $("matches-empty").textContent = t("matches_empty"); $("matches-empty").hidden = false; return; }

    var last = {};
    var mm = await db.from("messages").select("from_id,to_id,body,created_at")
      .or("from_id.eq." + me + ",to_id.eq." + me).order("created_at", { ascending: false }).limit(300);
    (mm.data || []).forEach(function (m) { var peer = m.from_id === me ? m.to_id : m.from_id; if (!last[peer]) last[peer] = m; });
    var seenAt = readMap();
    people.sort(function (x, y) {
      var lx = last[x.id] ? last[x.id].created_at : "", ly = last[y.id] ? last[y.id].created_at : "";
      return lx < ly ? 1 : lx > ly ? -1 : 0;
    });

    people.forEach(function (p) {
      var row = document.createElement("div"); row.className = "mrow link"; row.setAttribute("role", "button"); row.tabIndex = 0;
      var url = photoUrl(p), pic;
      if (url) { pic = document.createElement("img"); pic.src = url; pic.alt = ""; }
      else { pic = document.createElement("div"); pic.className = "mph"; pic.textContent = p.first_name.charAt(0).toUpperCase(); }
      var info = document.createElement("div"); info.className = "mi";
      var strong = document.createElement("strong"); strong.textContent = nameWithAge(p) + (p.verified ? " ✓" : "");
      var small = document.createElement("small");
      var lm = last[p.id];
      small.textContent = lm ? (lm.from_id === me ? t("you") : "") + lm.body : (p.country ? countryLabel(p.country) : "");
      info.appendChild(strong); info.appendChild(small);
      row.appendChild(pic); row.appendChild(info);
      if (lm && lm.from_id !== me && (!seenAt[p.id] || lm.created_at > seenAt[p.id])) {
        var bd = document.createElement("span"); bd.className = "badge"; bd.textContent = t("new_badge"); row.appendChild(bd);
      }
      row.onclick = function () { openChat(p); };
      row.onkeydown = function (e) { if (e.key === "Enter") openChat(p); };
      list.appendChild(row);
    });
  }
  $("go-matches").onclick = function () { showSection("matches"); loadMatches(); };
  $("matches-back").onclick = function () { showSection("home"); };

  $("go-likes").onclick = function () { showSection("likes"); loadLikes(); };
  $("likes-back").onclick = function () { showSection("home"); };

  // ---------- Conditions et confidentialité ----------

n, suppression, opposition, portabilité. Pour les exercer : contact@jadedating.app."], ["p", "Éditeur : [NOM / SOCIÉTÉ À COMPLÉTER]."]], en: [["h", "Draft text: have a lawyer review it before any public launch."], ["h", "1. Terms of use"], ["p", "Jade is a dating service for people aged 18 and over. By creating an account you confirm you are at least 18 and that your profile information is accurate."], ["p", "You agree not to impersonate anyone, not to post illegal, sexually explicit, hateful or violent content, not to harass other members, and never to ask for money."], ["p", "Jade does not sell relationships and is not a marriage agency. Verified profiles (✓) sent a selfie checked by our team, which does not guarantee a person's honesty. Stay careful: see the safety tips."], ["p", "We may suspend or delete an account that breaks these rules, notably after a report. The service is provided as is, without any guarantee of availability."], ["h", "2. Privacy"], ["p", "Data we collect: email, password (encrypted), first name, date of birth, country, gender, who you are looking for, bio, photos, messages, likes, reports and, if you request verification, a selfie."], ["p", "Purposes: running the app (profiles, matches, messaging), security and moderation, verifying profiles."], ["p", "Visibility: your first name, age, country, bio and photos are visible to other members. Your email, exact date of birth and verification selfie are never shown. Messages can only be read by you and your match."], ["p", "Hosting: your data is stored with Supabase (servers in India) and the site is hosted by GitHub. It is not sold."], ["p", "Retention: as long as your account exists. When you delete your account in the app, your profile, photos, selfie and messages are erased."], ["p", "Your rights (GDPR): access, correction, deletion, objection, portability. To exercise them: contact@jadedating.app."], ["p", "Publisher: [NAME / COMPANY TO COMPLETE]."]] };
  var legalFrom = "home";
  function openLegal(from) {
    legalFrom = from;
    var box = $("legal-body"); box.textContent = "";
    (LEGAL[lang] || LEGAL.en).forEach(function (b) {
      var el = document.createElement(b[0] === "h" ? "h3" : "p"); el.textContent = b[1]; box.appendChild(el);
    });
    showSection("legal");
  }
  $("go-legal").onclick = function () { openLegal("home"); };
  $("legal-link-auth").onclick = function () { openLegal("auth"); };
  $("legal-back").onclick = function () { showSection(legalFrom); };

  // ---------- Pastilles : nouveaux messages et nouveaux likes ----------
  var badgeTimer = null;
  function paintBadge(id, key, n) { $(id).textContent = t(key) + (n > 0 ? "  \u25CF " + n : ""); }
  async function checkBadges() {
    if (!currentUser) return;
    var me = currentUser.id, unread = 0, likes = 0;
    try {
      var mm = await db.from("messages").select("from_id,created_at").eq("to_id", me).order("created_at", { ascending: false }).limit(200);
      var seenAt = readMap(), lastIn = {};
      (mm.data || []).forEach(function (m) { if (!lastIn[m.from_id]) lastIn[m.from_id] = m.created_at; });
      Object.keys(lastIn).forEach(function (pid) { if (!seenAt[pid] || lastIn[pid] > seenAt[pid]) unread++; });
      var a = await db.from("swipes").select("to_id").eq("from_id", me);
      var b = await db.from("swipes").select("from_id").eq("to_id", me).eq("liked", true);
      var done = (a.data || []).map(function (x) { return x.to_id; });
      likes = (b.data || []).filter(function (x) { return done.indexOf(x.from_id) === -1; }).length;
    } catch (e) {}
    paintBadge("go-matches", "matches", unread);
    paintBadge("go-likes", "likes_btn", likes);
  }
  function startBadges() {
    checkBadges();
    if (!badgeTimer) badgeTimer = setInterval(function () { if (currentUser && !$("home").hidden) checkBadges(); }, 30000);
  }

  // ---------- Administration ----------
  var isAdmin = false;
  async function checkAdmin() {
    try {
      var r = await db.from("admins").select("user_id").eq("user_id", currentUser.id).maybeSingle();
      isAdmin = !!(r && r.data);
    } catch (e) { isAdmin = false; }
    $("go-admin").hidden = !isAdmin;
  }
  function abtn(label, fn) {
    var b = document.createElement("button"); b.type = "button"; b.className = "secondary"; b.textContent = label;
    b.onclick = async function () { b.disabled = true; try { await fn(); } catch (e) { say($("admsg"), e.message || "Erreur", "err"); } b.disabled = false; };
    return b;
  }
  function arow(p, lines, buttons, selfieUrl) {
    var row = document.createElement("div"); row.className = "arow";
    var url = p ? photoUrls(p)[0] : null;
    if (url) { var im = document.createElement("img"); im.src = url; im.alt = ""; row.appendChild(im); }
    if (selfieUrl) { var sf = document.createElement("img"); sf.src = selfieUrl; sf.alt = "selfie"; row.appendChild(sf); }
    var info = document.createElement("div"); info.className = "ainfo";
    lines.forEach(function (l, i) { var d = document.createElement(i === 0 ? "strong" : "div"); d.textContent = l; info.appendChild(d); });
    var bx = document.createElement("div"); bx.className = "abtns";
    buttons.forEach(function (b) { bx.appendChild(b); });
    info.appendChild(bx); row.appendChild(info);
    return row;
  }
  async function loadAdmin() {
    var vbox = $("admin-verifs"), rbox = $("admin-reports");
    vbox.textContent = ""; rbox.textContent = ""; say($("admsg"), "Chargement…", "");
    var v = await db.from("profiles").select("*").eq("verification_requested", true).eq("verified", false);
    if (v.error) return say($("admsg"), v.error.message, "err");
    if (!(v.data || []).length) { var e1 = document.createElement("p"); e1.className = "empty"; e1.textContent = "Aucune demande."; vbox.appendChild(e1); }
    for (var i = 0; i < (v.data || []).length; i++) {
      var p = v.data[i];
      var su = await db.storage.from("verifications").createSignedUrl(p.id + "/selfie", 600);
      vbox.appendChild(arow(p, [nameWithAge(p), p.country ? countryLabel(p.country) : ""], [
        abtn("✓ Valider", async function () { var x = await db.rpc("admin_set_verified", { uid: p.id, ok: true }); if (x.error) throw x.error; loadAdmin(); }),
        abtn("✗ Refuser", async function () { var x = await db.rpc("admin_set_verified", { uid: p.id, ok: false }); if (x.error) throw x.error; loadAdmin(); })
      ], su && su.data ? su.data.signedUrl : null));
    }
    var r = await db.from("reports").select("*").eq("handled", false).order("created_at", { ascending: false }).limit(50);
    if (r.error) return say($("admsg"), r.error.message, "err");
    var reps = r.data || [];
    if (!reps.length) { var e2 = document.createElement("p"); e2.className = "empty"; e2.textContent = "Aucun signalement."; rbox.appendChild(e2); }
    var ids = []; reps.forEach(function (x) { [x.reported_id, x.reporter_id].forEach(function (id) { if (id && ids.indexOf(id) === -1) ids.push(id); }); });
    var map = {};
    if (ids.length) { var pr = await db.from("profiles").select("*").in("id", ids); (pr.data || []).forEach(function (x) { map[x.id] = x; }); }
    reps.forEach(function (rep) {
      var tp = map[rep.reported_id], by = map[rep.reporter_id];
      var lines = [(tp ? nameWithAge(tp) : "Profil introuvable") + (tp && tp.suspended ? " (suspendu)" : ""),
        "Motif : " + rep.reason, rep.details ? "Détails : " + rep.details : "",
        "Signalé par : " + (by ? by.first_name : "?") + (rep.created_at ? " · " + new Date(rep.created_at).toLocaleDateString() : "")].filter(Boolean);
      var btns = [abtn("Marquer traité", async function () { var x = await db.rpc("admin_handle_report", { rid: String(rep.id) }); if (x.error) throw x.error; loadAdmin(); })];
      if (tp) btns.push(abtn(tp.suspended ? "Réactiver" : "Suspendre le compte", async function () {
        if (!tp.suspended && !confirm("Suspendre ce compte ?")) return;
        var x = await db.rpc("admin_set_suspended", { uid: tp.id, flag: !tp.suspended }); if (x.error) throw x.error; loadAdmin();
      }));
      rbox.appendChild(arow(tp, lines, btns));
    });
    say($("admsg"), "", "");
  }
  $("go-admin").onclick = function () { showSection("admin"); loadAdmin(); };
  $("admin-back").onclick = function () { showSection("home"); };

  // ---------- Messagerie ----------
  var chatWith = null, chatTimer = null, lastCount = -1;

  function stopChat() { if (chatTimer) { clearInterval(chatTimer); chatTimer = null; } }

  async function refreshChat() {
    if (!chatWith || !currentUser) return;
    var me = currentUser.id, other = chatWith.id;
    var r = await db.from("messages").select("*")
      .or("and(from_id.eq." + me + ",to_id.eq." + other + "),and(from_id.eq." + other + ",to_id.eq." + me + ")")
      .order("created_at", { ascending: true }).limit(200);
    if (r.error) return say($("cmsg"), r.error.message, "err");
    var box = $("chat-box");
    var stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
    box.textContent = "";
    var rows = r.data || [], lastMine = -1;
    rows.forEach(function (m, i) { if (m.from_id === me) lastMine = i; });
    rows.forEach(function (m, i) {
      var mine = m.from_id === me;
      var w = document.createElement("div"); w.className = "bwrap " + (mine ? "me" : "them");
      var d = document.createElement("div"); d.className = "bubble " + (mine ? "me" : "them"); d.textContent = m.body; w.appendChild(d);
      var meta = document.createElement("div"); meta.className = "bmeta";
      var tm = m.created_at ? new Date(m.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
      meta.appendChild(document.createTextNode(tm));
      if (!mine) {
        var a = document.createElement("a"); a.textContent = t("translate"); a.target = "_blank"; a.rel = "noopener noreferrer";
        a.href = "https://translate.google.com/?sl=auto&tl=" + (lang === "zh" ? "zh-CN" : lang) + "&op=translate&text=" + encodeURIComponent(m.body);
        meta.appendChild(document.createTextNode(" · ")); meta.appendChild(a);
      } else if (i === lastMine && m.read_at) {
        meta.appendChild(document.createTextNode(" · " + t("seen") + " ✓✓"));
      }
      w.appendChild(meta); box.appendChild(w);
    });
    $("ice").hidden = rows.length > 0;
    if (rows.some(function (m) { return m.from_id === other && !m.read_at; })) {
      db.rpc("mark_messages_read", { peer: other }).then(function () {}, function () {});
    }
    if (stick || lastCount !== (r.data || []).length) box.scrollTop = box.scrollHeight;
    lastCount = (r.data || []).length;
    markRead(other);
  }

  function openChat(p) {
    chatWith = p; lastCount = -1;
    $("chat-name").textContent = p.first_name;
    $("chat-box").textContent = ""; $("chat-input").value = ""; $("ice").hidden = true;
    say($("cmsg"), "", "");
    showSection("chat");
    markRead(p.id);
    refreshChat();
    stopChat();
    chatTimer = setInterval(refreshChat, rtOk ? 15000 : 4000);
  }

  Array.prototype.forEach.call(document.querySelectorAll("#ice .chip"), function (b) {
    b.onclick = function () { $("chat-input").value = b.textContent; $("chat-input").focus(); };
  });

  $("chat-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var text = $("chat-input").value.trim();
    if (!text || !chatWith) return;
    $("chat-send").disabled = true;
    var r = await db.from("messages").insert({ from_id: currentUser.id, to_id: chatWith.id, body: text });
    if (r.error) say($("cmsg"), t("e_send") + r.error.message, "err");
    else { $("chat-input").value = ""; say($("cmsg"), "", ""); await refreshChat(); }
    $("chat-send").disabled = false;
  });
  $("chat-back").onclick = function () { showSection("matches"); loadMatches(); };

  // ---------- Signaler / bloquer ----------
  var reportTarget = null, reportReturn = "home";

  function openReport(p, ret) {
    reportTarget = p; reportReturn = ret;
    $("report-name").textContent = p.first_name;
    $("report-reason").value = ""; $("report-details").value = "";
    say($("rmsg"), "", "");
    showSection("report");
  }
  $("cand-report").onclick = function () { if (candidate) openReport(candidate, "discover"); };
  $("chat-report").onclick = function () { if (chatWith) openReport(chatWith, "chat"); };
  $("report-back").onclick = function () { showSection(reportReturn); };

  $("report-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!$("report-reason").value) return say($("rmsg"), t("e_reason"), "err");
    $("report-send").disabled = true;
    var r = await db.from("reports").insert({
      reporter_id: currentUser.id, reported_id: reportTarget.id,
      reason: $("report-reason").value, details: $("report-details").value.trim() || null
    });
    if (r.error) say($("rmsg"), t("e_send") + r.error.message, "err");
    else {
      say($("rmsg"), t("ok_report"), "ok");
      setTimeout(function () { if (!$("report").hidden) showSection(reportReturn); }, 2200);
    }
    $("report-send").disabled = false;
  });

  $("chat-block").onclick = async function () {
    if (!chatWith) return;
    if (!confirm(t("block_confirm", { name: chatWith.first_name }))) return;
    var r = await db.from("blocks").insert({ blocker_id: currentUser.id, blocked_id: chatWith.id });
    if (r.error) return say($("cmsg"), t("e_block") + r.error.message, "err");
    chatWith = null;
    showSection("matches"); loadMatches();
  };

  // ---------- Vérification du profil ----------
  function renderVerifyStatus() {
    var st = $("verify-status"), form = $("verify-form");
    if (currentProfile && currentProfile.verified) { st.textContent = t("verify_status_ok"); st.style.color = "var(--ok)"; form.hidden = true; }
    else if (currentProfile && currentProfile.verification_requested) { st.textContent = t("verify_status_pending"); st.style.color = "var(--muted)"; form.hidden = false; }
    else { st.textContent = ""; form.hidden = false; }
  }
  $("go-verify").onclick = function () { $("verify-file").value = ""; say($("vmsg"), "", ""); renderVerifyStatus(); showSection("verify"); };
  $("verify-back").onclick = function () { showSection("home"); };

  $("verify-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var f = $("verify-file").files[0], msg = $("vmsg");
    if (!f) return say(msg, t("e_verify_file"), "err");
    if (!/^image\/(jpeg|png|webp)$/.test(f.type)) return say(msg, t("e_photo_type"), "err");
    if (f.size > 5 * 1024 * 1024) return say(msg, t("e_photo_size"), "err");
    $("verify-send").disabled = true; say(msg, t("wait"), "");
    try {
      var up = await db.storage.from("verifications").upload(currentUser.id + "/selfie", f, { upsert: true, contentType: f.type });
      if (up.error) throw up.error;
      var u = await db.from("profiles").update({ verification_requested: true }).eq("id", currentUser.id).select().single();
      if (u.error) throw u.error;
      currentProfile = u.data;
      say(msg, t("verify_sent"), "ok"); renderVerifyStatus();
    } catch (err) { say(msg, err.message || t("e_generic"), "err"); }
    $("verify-send").disabled = false;
  });

  // ---------- Sécurité, déconnexion, suppression ----------
  $("go-safety").onclick = function () { showSection("safety"); };
  $("safety-back").onclick = function () { showSection("home"); };

  $("logout").onclick = async function () { await db.auth.signOut(); show(null); setMode("login"); };

  $("delete-account").onclick = async function () {
    if (!confirm(t("delete_confirm"))) return;
    var hmsg = $("hmsg"); say(hmsg, t("deleting"), "");
    try {
      var uid = currentUser.id, buckets = ["photos", "verifications"];
      for (var i = 0; i < buckets.length; i++) {
        var l = await db.storage.from(buckets[i]).list(uid);
        if (l.data && l.data.length) {
          await db.storage.from(buckets[i]).remove(l.data.map(function (f) { return uid + "/" + f.name; }));
        }
      }
      var r = await db.rpc("delete_my_account");
      if (r.error) throw r.error;
      try { await db.auth.signOut({ scope: "local" }); } catch (x) {}
      show(null); setMode("signup");
      say($("msg"), t("deleted"), "ok");
    } catch (err) { say(hmsg, t("e_delete") + (err.message || err), "err"); }
  };

  applyI18n();
  setMode("signup");
  db.auth.getSession().then(function (r) { show(r.data.session ? r.data.session.user : null); });
</script>
